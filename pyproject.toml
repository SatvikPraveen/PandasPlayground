# ============================================================================
# PandasPlayground: project configuration (PEP 517 / PEP 621)
# ============================================================================

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandasplayground"
version = "2.0.0"
description = "A reproducible, tested toolkit and curriculum for rigorous data manipulation with pandas."
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
maintainers = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["pandas", "data-science", "reproducibility", "data-validation", "benchmarking", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.18"]
app = ["streamlit>=1.33", "plotly>=5.18", "statsmodels>=0.14"]
datagen = ["Faker>=24.0"]
notebooks = ["jupyterlab>=4.0", "notebook>=7.0", "ipykernel>=6.29", "nbformat>=5.9", "nbconvert>=7.10"]
perf = ["memory_profiler>=0.61", "psutil>=5.9", "dask[dataframe]>=2024.4"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "nbmake>=1.5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.6",
]
all = ["pandasplayground[viz,app,datagen,notebooks,perf,dev]"]

[project.scripts]
pandasplayground = "pandasplayground.cli:main"

[project.urls]
Homepage = "https://github.com/SatvikPraveen/PandasPlayground"
Repository = "https://github.com/SatvikPraveen/PandasPlayground"
Documentation = "https://github.com/SatvikPraveen/PandasPlayground/tree/main/docs"
Changelog = "https://github.com/SatvikPraveen/PandasPlayground/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/SatvikPraveen/PandasPlayground/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandasplayground = ["py.typed"]

# ============================================================================
# Tooling
# ============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "docs/*.ipynb", "pandas_env", "venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "NPY",      # numpy-specific rules
    "PD",       # pandas-vet
    "RUF",      # ruff-specific
]
ignore = [

    "PD011",    # `.values` false positives on non-pandas objects
    "RUF001", "RUF002", "RUF003",  # allow unicode in strings/docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD", "B011"]
"scripts/**" = ["F401", "F403"]
"pages/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pandasplayground", "scripts"]

[tool.mypy]
files = ["src/pandasplayground"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "integration: tests that touch the committed datasets",
]
filterwarnings = ["error::FutureWarning:pandasplayground.*"]

[tool.coverage.run]
source = ["pandasplayground"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
