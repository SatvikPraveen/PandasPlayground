name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src scripts tests pages STREAMLIT_App.py
      - name: Ruff format
        run: ruff format --check src scripts tests pages STREAMLIT_App.py
      - name: Mypy (strict)
        run: mypy
      - name: Data dictionary is in sync with schemas
        run: pandasplayground docs data-dictionary --check

  test:
    name: Tests (py${{ matrix.python }}, pandas ${{ matrix.pandas }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", pandas: "2.2.*" }
          - { os: ubuntu-latest, python: "3.11", pandas: "latest" }
          - { os: ubuntu-latest, python: "3.12", pandas: "2.2.*" }
          - { os: ubuntu-latest, python: "3.12", pandas: "latest" }
          - { os: ubuntu-latest, python: "3.13", pandas: "latest" }
          - { os: macos-latest, python: "3.13", pandas: "latest" }
          - { os: windows-latest, python: "3.12", pandas: "latest" }
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        shell: bash
        run: |
          pip install -e ".[dev,datagen,app]"
          if [ "${{ matrix.pandas }}" != "latest" ]; then pip install "pandas==${{ matrix.pandas }}"; fi
          python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"
      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term -m "not slow"
      - name: Upload coverage report
        if: matrix.python == '3.12' && matrix.pandas == 'latest' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  slow-tests:
    name: Statistical property tests (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,datagen]"
      - run: pytest -m slow -o addopts="--strict-markers"

  reproducibility:
    name: Reproducibility (pipeline + notebooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - name: Validate every bundled dataset against its schema
        run: pandasplayground validate
      - name: Re-run pipeline from raw data and require a byte-identical export
        run: |
          pandasplayground pipeline
          git diff --exit-code -- exports/final_merged_pipeline.csv
      - name: Regenerate synthetic data and validate it
        run: |
          pandasplayground generate --out runs/generated
          pandasplayground validate --data-dir runs/generated --export /nonexistent
      - name: Execute every notebook
        run: pytest --nbmake --nbmake-timeout=900 notebooks -o addopts=""
      - name: Notebook CSV outputs must not drift
        run: git diff --exit-code --stat -- '*.csv'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pandasplayground:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm pandasplayground:ci pandasplayground --version
          docker run --rm pandasplayground:ci pandasplayground validate
